<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="optionsTitle">İstima</title>
  <link rel="icon" href="../icons/icon-32.png">
  <link rel="stylesheet" href="../ui/ui.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <img src="../icons/logo.svg" alt="" width="52" height="52">
      <div>
        <h1>İstima</h1>
        <p class="muted" data-i18n="optionsTagline"></p>
      </div>
    </header>

    <section class="card section">
      <h2 data-i18n="optReading"></h2>
      <div class="row column">
        <div><strong id="model-label" data-i18n="optModel"></strong><p data-i18n="optModelHint"></p></div>
        <div class="segmented" id="model" role="group" aria-labelledby="model-label">
          <button type="button" data-value="antalia">Antalia-2 Mini</button>
          <button type="button" data-value="ema">EMA Lightning</button>
        </div>
      </div>
      <div class="row">
        <div><strong data-i18n="optSpeed"></strong><p data-i18n="optSpeedHint"></p></div>
        <div class="segmented" id="speed" role="group" data-i18n-aria="optSpeed"></div>
      </div>
      <label class="row"><div><strong data-i18n="optReadTitle"></strong><p data-i18n="optReadTitleHint"></p></div><span class="switch"><input type="checkbox" data-key="readTitle"><span></span></span></label>
      <label class="row"><div><strong data-i18n="optHighlight"></strong><p data-i18n="optHighlightHint"></p></div><span class="switch"><input type="checkbox" data-key="highlight"><span></span></span></label>
      <label class="row"><div><strong data-i18n="optAutoScroll"></strong><p data-i18n="optAutoScrollHint"></p></div><span class="switch"><input type="checkbox" data-key="autoScroll"><span></span></span></label>
      <label class="row needs-auto"><div><strong data-i18n="optAutoPlay"></strong><p data-i18n="optAutoPlayHint"></p></div><span class="switch"><input type="checkbox" data-key="autoPlay"><span></span></span></label>
    </section>

    <section class="card section">
      <h2 data-i18n="optAppearance"></h2>
      <label class="row"><div><strong data-i18n="optAutoDetect"></strong><p data-i18n="optAutoDetectHint"></p></div><span class="switch"><input type="checkbox" id="auto-detect"><span></span></span></label>
      <label class="row needs-auto"><div><strong data-i18n="optShowButton"></strong><p data-i18n="optShowButtonHint"></p></div><span class="switch"><input type="checkbox" data-key="showButton"><span></span></span></label>
      <div class="row">
        <div><strong data-i18n="optPosition"></strong><p data-i18n="optPositionHint"></p></div>
        <div class="segmented narrow" id="position" role="group" data-i18n-aria="optPosition">
          <button type="button" data-value="left" data-i18n="optLeft"></button>
          <button type="button" data-value="right" data-i18n="optRight"></button>
        </div>
      </div>
      <div class="row column">
        <div><strong data-i18n="optSites"></strong><p data-i18n="optSitesHint"></p></div>
        <form class="site-form" id="site-form">
          <input id="site-input" type="text" inputmode="url" autocomplete="off" data-i18n-placeholder="optSitesPlaceholder">
          <button class="btn" type="submit" data-i18n="optSitesAdd"></button>
        </form>
        <ul class="sites" id="sites"></ul>
        <p class="muted small" id="sites-empty" data-i18n="optSitesEmpty"></p>
      </div>
    </section>

    <section class="card section">
      <h2 data-i18n="optTry"></h2>
      <p class="muted" data-i18n="optTryHint"></p>
      <textarea id="try-text" rows="4"></textarea>
      <div class="try-actions">
        <button class="btn btn-primary" id="try-play" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.6v12.8a1 1 0 0 0 1.5.86l10.2-6.4a1 1 0 0 0 0-1.72L9.5 4.74A1 1 0 0 0 8 5.6z" fill="currentColor"/></svg>
          <span data-i18n="optTryPlay"></span>
        </button>
        <button class="btn" id="try-stop" type="button" data-i18n="popupStop"></button>
        <span class="muted small" id="try-status" aria-live="polite"></span>
      </div>
    </section>

    <section class="card section">
      <h2 data-i18n="optShortcuts"></h2>
      <ul class="shortcuts" id="shortcuts"></ul>
      <p class="muted small"><span data-i18n="optAltClick"></span></p>
      <button class="btn" id="edit-shortcuts" type="button" data-i18n="optEditShortcuts"></button>
    </section>

    <section class="card section about">
      <h2 data-i18n="optAbout"></h2>
      <p data-i18n="optPrivacy"></p>
      <p data-i18n-html="optCredits"></p>
      <p class="muted small"><span id="version"></span> · <a href="https://istima.ubeydgencer.com" target="_blank" rel="noopener">istima.ubeydgencer.com</a> · <a href="https://istima.ubeydgencer.com/gizlilik/" target="_blank" rel="noopener" data-i18n="optPrivacyLink"></a> · <a href="https://github.com/ubeydgencer/istima" target="_blank" rel="noopener">GitHub</a></p>
    </section>
    <p class="saved" id="saved" role="status" aria-live="polite"></p>
  </div>
  <script type="module" src="options.js"></script>
</body>
</html>
